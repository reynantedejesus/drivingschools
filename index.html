function validateInstructor(d, id) {
  const e = {}, T = todayISO();
  if (!d.firstName) e.firstName = 'Enter a first name';
  if (!d.surname) e.surname = 'Enter a surname';
  if (!d.mobile) e.mobile = 'Enter a mobile phone number';
  else if (!validPhone(d.mobile)) e.mobile = 'Enter a valid UK mobile number, like 07700 900123';
  if (!d.email) e.email = 'Enter an email address';
  else if (!reEmail.test(d.email)) e.email = 'Enter an email address in the correct format';
  else if (db.instructors.some(i => i.id !== id && i.email.toLowerCase() === d.email.toLowerCase())) e.email = 'Another instructor already uses this email address';
  if (!d.dob) e.dob = 'Enter a date of birth';
  else if (ageOn(d.dob) < 21) e.dob = 'Instructors must be at least 21 years old';
  if (!d.addressLine1) e.addressLine1 = 'Enter the first line of the address';
  if (!d.town) e.town = 'Enter a town or city';
  if (!d.postcode) e.postcode = 'Enter a postcode';
  else if (!rePostcode.test(d.postcode)) e.postcode = 'Enter a valid UK postcode';
  if (!d.adiNumber) e.adiNumber = 'Enter the ADI licence number';
  else if (!/^\d{6}$/.test(d.adiNumber)) e.adiNumber = 'ADI licence number must be 6 digits';
  else if (db.instructors.some(i => i.id !== id && i.adiNumber === d.adiNumber)) e.adiNumber = 'Another instructor already has this ADI number';
  if (!d.licenceExpiry) e.licenceExpiry = 'Enter the ADI licence expiry date';
  else if (d.licenceExpiry < T) e.licenceExpiry = 'This ADI licence has expired';
  if (!d.specialisms.length) e.specialisms = 'Select at least one specialism';
  if (!d.workingDays.length) e.workingDays = 'Select at least one working day';
  if (!d.availStart) e.availStart = 'Enter a start time';
  if (!d.availEnd) e.availEnd = 'Enter a finish time';
  else if (d.availStart && toMin(d.availEnd) <= toMin(d.availStart)) e.availEnd = 'Finish time must be after the start time';
  if (!d.status) e.status = 'Choose a status';
  return e;
}
function wireInstructorForm(id) {
  const f = $('#instructor-form');
  if (!f) return;
  wireLiveValidation(f);
  f.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(f);
    const d = readForm(f);
    d.specialisms = fd.getAll('specialisms');
    d.workingDays = DAYS.filter(x => fd.getAll('workingDays').includes(x));
    if (!showErrors(f, validateInstructor(d, id))) return;
    d.postcode = normPostcode(d.postcode);
    if (id) {
      Object.assign(getI(id), d);
      persist();
      toast(`${d.firstName} ${d.surname}’s details have been updated`);
      navigate('#/instructors/' + id);
    } else {
      const i = { id: uid('i'), ...d, colour: d.colour || COLOURS[0], createdAt: todayISO() };
      db.instructors.push(i);
      persist();
      toast(`${fullName(i)} has been added as a new instructor`);
      navigate('#/instructors/' + i.id);
    }
  });
}

function findConflicts(b) {
  const s = toMin(b.start), e = toMin(b.end);
  return db.bookings.filter(x => x.id !== b.id && x.status !== 'Cancelled' && x.date === b.date &&
    toMin(x.start) < e && toMin(x.end) > s && (x.instructorId === b.instructorId || x.studentId === b.studentId));
}
function conflictMessage(x, b) {
  const who = x.instructorId === b.instructorId ? fullName(getI(x.instructorId)) : fullName(getS(x.studentId));
  const what = x.instructorId === b.instructorId ? `${kindLabel(x).toLowerCase()} with ${fullName(getS(x.studentId))}` : `${kindLabel(x).toLowerCase()} with ${fullName(getI(x.instructorId))}`;
  return `${who} is already booked ${x.start}–${x.end} (${what}). Choose a different time.`;
}
function availabilityIssues(b) {
  const ins = getI(b.instructorId);
  if (!ins || !b.date || !b.start || !b.end) return [];
  const out = [];
  if (!worksOn(ins, b.date)) out.push(`${fullName(ins)} doesn’t normally work on ${DAY_NAMES[dow(b.date)]}s`);
  else if (toMin(b.start) < toMin(ins.availStart) || toMin(b.end) > toMin(ins.availEnd)) out.push(`This is outside ${fullName(ins)}’s usual hours (${ins.availStart}–${ins.availEnd})`);
  return out;
}

      ${field({ name: 'status', label: 'Status', type: 'select', required: true, value: b.status, options: STATUSES })}
      ${field({ name: 'result', label: 'Test result', type: 'select', required: true, value: b.result, options: [['', 'Select…'], ['Pass', 'Passed'], ['Fail', 'Failed']], hidden: !(b.kind === 'test' && b.status === 'Completed') })}
      ${field({ name: 'notes', label: 'Notes', type: 'textarea', value: b.notes, full: true, rows: 2, placeholder: 'e.g. focus areas, meeting point details…' })}
    </div>
  </form>`;
  const m = openModal({
    title: editing ? `Edit ${kindLabel(b).toLowerCase()}` : 'Add lesson or test', size: 'lg', body,
    footer: `<button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" form="booking-form" class="btn btn-accent">${ic('check')}${editing ? 'Save changes' : 'Save booking'}</button>`
  });
  const f = $('#booking-form', m.el);
  const el = n => f.elements[n];
  el('lessonType').innerHTML = typeOptions(b.kind, b.lessonType);
  wireLiveValidation(f);
  let endTouched = editing, insTouched = editing || !!o.instructorId;
  let autoPickup = b.pickup;
  const kindVal = () => (f.querySelector('input[name=kind]:checked') || {}).value || 'lesson';

  function syncKind(adjustEnd) {
    const k = kindVal();
    el('lessonType').innerHTML = typeOptions(k, el('lessonType').value);
    $('[data-field=lessonType] .lbl', f).textContent = k === 'test' ? 'Test type' : 'Lesson type';
    $('[data-field=testCentre]', f).hidden = k !== 'test';
    if (k === 'test' && !el('lessonType').value) {
      const st = getS(el('studentId').value);
      el('lessonType').value = st && st.transmission === 'Automatic' ? TEST_TYPES[1] : TEST_TYPES[0];
    }
    if (adjustEnd && !endTouched && el('start').value) el('end').value = fromMin(Math.min(toMin(el('start').value) + (k === 'test' ? 90 : 60), 23 * 60 + 30));
    syncResult();
  }
  function syncResult() { $('[data-field=result]', f).hidden = !(kindVal() === 'test' && el('status').value === 'Completed'); }
  function current_() {
    return { id: b.id, kind: kindVal(), studentId: el('studentId').value, instructorId: el('instructorId').value, date: el('date').value, start: el('start').value, end: el('end').value };
  }
  function liveCheck() {
    const ins = getI(el('instructorId').value);
    $('#f-instructorId-hint', f).textContent = ins ? `Works ${daysSummary(ins)}, ${ins.availStart}–${ins.availEnd}` : ' ';
    const c = current_();
    const box = $('#bk-check', f);
    if (!c.date || !c.start || !c.end || toMin(c.end) <= toMin(c.start) || (!c.instructorId && !c.studentId) || el('status').value === 'Cancelled') { box.innerHTML = ''; return; }
    const cf = findConflicts(c);
    if (cf.length) { box.innerHTML = `<div class="inline-alert error">${ic('alert')}<span><strong>Scheduling conflict.</strong> ${esc(conflictMessage(cf[0], c))}</span></div>`; return; }
    const iss = availabilityIssues(c);
    if (iss.length) { box.innerHTML = `<div class="inline-alert warn">${ic('info')}<span>${esc(iss.join('. '))}. You can still book, but please check with the instructor.</span></div>`; return; }
    box.innerHTML = c.instructorId && c.studentId ? `<div class="inline-alert ok">${ic('check')}<span>This time slot is available.</span></div>` : '';
  }
  f.addEventListener('change', e => {
    const n = e.target.name;
    if (n === 'kind') syncKind(true);
    if (n === 'status') syncResult();
    if (n === 'end') endTouched = true;
    if (n === 'instructorId') insTouched = true;
    if (n === 'studentId') {
      const st = getS(el('studentId').value);
      if (st) {
        const si = getI(st.instructorId);
        if (!insTouched && si && si.status === 'Active') el('instructorId').value = si.id;
        if (!el('pickup').value || el('pickup').value === autoPickup) { autoPickup = homeLoc(st); el('pickup').value = autoPickup; }
        if (kindVal() === 'test') el('lessonType').value = st.transmission === 'Automatic' ? TEST_TYPES[1] : TEST_TYPES[0];
      }
    }
    if (n === 'start' && !endTouched && el('start').value) el('end').value = fromMin(Math.min(toMin(el('start').value) + (kindVal() === 'test' ? 90 : 60), 23 * 60 + 30));
    liveCheck();
  });
  f.addEventListener('input', e => { if (e.target.name === 'end') endTouched = true; });
  syncKind(false);
  liveCheck();

  f.addEventListener('submit', async e => {
    e.preventDefault();
    const d = { ...b, ...readForm(f) };
    d.kind = kindVal();
    if (d.kind !== 'test') { d.testCentre = ''; d.result = ''; }
    if (!(d.kind === 'test' && d.status === 'Completed')) d.result = '';
    const errs = {};
    if (!d.studentId) errs.studentId = 'Select a student';
    if (!d.instructorId) errs.instructorId = 'Select an instructor';
    if (!d.date) errs.date = 'Choose a date';
    if (!d.start) errs.start = 'Enter a start time';
    if (!d.end) errs.end = 'Enter an end time';
    else if (d.start) {
      const dur = toMin(d.end) - toMin(d.start);
      if (dur <= 0) errs.end = 'End time must be after the start time';
      else if (dur < 30) errs.end = 'Bookings must be at least 30 minutes long';
      else if (dur > 240) errs.end = 'Bookings cannot be longer than 4 hours';
    }
    if (!d.lessonType) errs.lessonType = d.kind === 'test' ? 'Select a test type' : 'Select a lesson type';
    if (d.kind === 'test' && !d.testCentre) errs.testCentre = 'Select a test centre';
    if (!d.pickup) errs.pickup = 'Enter a pickup location';
    if (d.status === 'Completed' && d.date > todayISO()) errs.status = 'A future booking cannot be marked as completed';
    if (d.kind === 'test' && d.status === 'Completed' && !d.result) errs.result = 'Record whether the student passed or failed';
    if (!Object.keys(errs).length && d.status !== 'Cancelled') {
      const cf = findConflicts(d);
      if (cf.length) errs.start = conflictMessage(cf[0], d);
    }
    if (!showErrors(f, errs)) return;
    if (d.status !== 'Cancelled') {
      const iss = availabilityIssues(d);
      if (iss.length && !(editing && getB(d.id).date === d.date && getB(d.id).start === d.start && getB(d.id).end === d.end && getB(d.id).instructorId === d.instructorId)) {
        const ok = await confirmDialog({ title: 'Outside normal availability', message: `${esc(iss.join('. '))}.<br><br>Do you still want to save this booking?`, confirmText: 'Book anyway' });
        if (!ok) return;
      }
    }
    if (!d.dropoff) d.dropoff = d.pickup;
    const st = getS(d.studentId);
    if (editing) Object.assign(getB(d.id), d);
    else { d.id = uid('b'); db.bookings.push(d); }
    persist();
    closeModal(m);
    toast(`${kindLabel(d)} ${editing ? 'updated' : 'booked'} for ${fullName(st)} — ${relDay(d.date)} at ${d.start}`);
    refresh();
  });
}

/* =========================================================
   VIEW: Settings / not found
   ========================================================= */
function viewSettings() {
  const counts = [[db.students.length, 'Students'], [db.instructors.length, 'Instructors'], [db.bookings.filter(b => b.kind === 'lesson').length, 'Lessons'], [db.bookings.filter(b => b.kind === 'test').length, 'Driving tests']];
  return `
  <div class="page-head"><div><h1>Settings</h1><p class="muted">Prototype controls and information.</p></div></div>
  <div class="settings-grid">
    <section class="card"><div class="card-head"><h2>${ic('info')}About this prototype</h2><span class="proto-pill">Prototype only</span></div>
      <div class="card-body prose">
        <p>This is a <strong>client-facing proof of concept</strong> for the Northgate School of Motoring management app. It demonstrates the screens and workflows for the planned web application.</p>
        <ul>
          <li>All data is <strong>simulated</strong> and stored only in this browser (<code>localStorage</code>).</li>
          <li>There is no login, payment processing or server — nothing is sent anywhere.</li>
          <li>Sample bookings are generated relative to the day the data was created, so the calendar always looks current.</li>
          <li>The production version is planned as a Python Flask application with a MySQL database.</li>
        </ul>
      </div></section>
    <section class="card"><div class="card-head"><h2>${ic('settings')}Prototype data</h2></div>
      <div class="card-body">
        <p class="muted">Sample data generated on ${esc(fmtLong(db.seededOn))}. Storage: ${storageOK ? '<span class="badge badge-green">Saving in this browser</span>' : '<span class="badge badge-red">Unavailable — changes not saved</span>'}</p>
        <div class="data-counts">${counts.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('')}</div>
        <div style="display:flex;flex-wrap:wrap;gap:10px">
          <button type="button" class="btn btn-outline" data-action="export-data">${ic('download')}Export data (JSON)</button>
          <button type="button" class="btn btn-danger" data-action="reset-data">${ic('refresh')}Reset prototype data</button>
        </div>
        <p class="muted" style="margin-top:12px;font-size:.88rem">Resetting removes every student, instructor, lesson and test you have added or changed, and restores fresh sample data.</p>
      </div></section>
  </div>`;
}
function viewNotFound(msg = 'Page not found') {
  return `<div class="card empty" style="margin-top:20px">${ic('alert')}<h3>${esc(msg)}</h3><p>The record may have been removed when prototype data was reset.</p><a class="btn btn-primary" href="#/dashboard">Go to dashboard</a></div>`;
}

/* =========================================================
   Quick-add menu
   ========================================================= */
function openQuickMenu() { $('#qa-menu').hidden = false; $('#qa-btn').setAttribute('aria-expanded', 'true'); $('#qa-menu button').focus(); }
function closeQuickMenu() { const m = $('#qa-menu'); if (m && !m.hidden) { m.hidden = true; $('#qa-btn').setAttribute('aria-expanded', 'false'); } }

/* =========================================================
   Actions (event delegation)
   ========================================================= */
const actions = {
  stop() { /* let the link do its job; prevents the parent row action */ },
  skip() { $('#main').focus(); },
  go(el) { closeQuickMenu(); navigate(el.dataset.href); },
  'quick-menu'() { $('#qa-menu').hidden ? openQuickMenu() : closeQuickMenu(); },
  'dismiss-banner'() { ui.bannerDismissed = true; saveUI(); refresh(); },
  'dash-filter'(el) { ui.dashFilter = el.dataset.filter; saveUI(); refresh(); },
  'new-booking'(el) {
    closeQuickMenu();
    openBookingForm({ kind: el.dataset.kind, studentId: el.dataset.student, instructorId: el.dataset.instructor, date: el.dataset.date });
  },
  slot(el) { openBookingForm({ date: el.dataset.date, start: el.dataset.time, instructorId: el.dataset.instructor || undefined }); },
  booking(el) { openBookingDetails(el.dataset.id); },
  'bk-edit'(el) { closeModal(); openBookingForm({ id: el.dataset.id }); },
  async 'bk-cancel'(el) {
    const b = getB(el.dataset.id), s = getS(b.studentId);
    const ok = await confirmDialog({ title: `Cancel this ${b.kind === 'test' ? 'driving test' : 'lesson'}?`,
      message: `${esc(fullName(s))} — ${esc(fmtLong(b.date))}, ${b.start}–${b.end}.<br><br>The booking will stay in the calendar marked as <strong>Cancelled</strong>. You can reinstate it later.`,
      confirmText: 'Yes, cancel booking', cancelText: 'Keep booking', danger: true });
    if (!ok) return;
    b.status = 'Cancelled';
    b.notes = (b.notes ? b.notes + '\n' : '') + `Cancelled on ${fmtDMY(todayISO())} (prototype).`;
    persist(); closeModal(); toast(`${kindLabel(b)} for ${fullName(s)} cancelled`, 'info'); refresh();
  },
  async 'bk-complete'(el) {
    const b = getB(el.dataset.id), s = getS(b.studentId);
    if (b.date > todayISO()) { toast('A future booking cannot be marked as completed yet.', 'error'); return; }
    let result = '';
    if (b.kind === 'test') {
      result = await confirmDialog({ title: 'Record test result', message: `Did <strong>${esc(fullName(s))}</strong> pass their driving test?`, cancelText: 'Not now',
        choices: [{ value: 'Fail', label: 'Failed', cls: 'btn-danger-outline', icon: 'x' }, { value: 'Pass', label: 'Passed', cls: 'btn-accent', icon: 'check' }] });
      if (!result) return;
    }
    b.status = 'Completed'; b.result = result;
    persist(); closeModal();
    toast(b.kind === 'test' ? (result === 'Pass' ? `Congratulations — ${fullName(s)} passed!` : `Test result recorded for ${fullName(s)}`) : `Lesson marked as completed for ${fullName(s)}`);
    refresh();
  },
  'bk-reinstate'(el) {
    const b = getB(el.dataset.id);
    const cf = findConflicts({ ...b, status: 'Scheduled' });
    if (cf.length) { toast(`Can’t reinstate: ${conflictMessage(cf[0], b)}`, 'error'); return; }
    b.status = 'Scheduled';
    persist(); closeModal(); toast(`${kindLabel(b)} reinstated`); refresh();
  },
  'cal-prev'() { calShift(-1); },
  'cal-next'() { calShift(1); },
  'cal-today'() { ui.cal.date = todayISO(); route(); },
  'cal-view'(el) { ui.cal.view = el.dataset.view; saveUI(); route(); },
  'cal-goto'(el, e) {
    e.preventDefault();
    ui.cal.date = el.dataset.date;
    if (el.dataset.view) ui.cal.view = el.dataset.view;
    saveUI();
    navigate('#/calendar');
  },
  'ins-calendar'(el) { ui.cal.instructor = el.dataset.id; ui.cal.view = isMobile() ? 'day' : 'week'; ui.cal.date = todayISO(); saveUI(); navigate('#/calendar'); },
  'students-status'(el) { ui.students.status = el.dataset.status; refresh(); },
  'students-filter'(el, e) { e.preventDefault(); ui.students = { q: '', status: el.dataset.status, instructor: 'all' }; navigate('#/students'); },
  'students-clear'() { ui.students = { q: '', status: 'all', instructor: 'all' }; refresh(); },
  'instructors-status'(el) { ui.instructors.status = el.dataset.status; refresh(); },
  tab(el) { ui.profileTab = el.dataset.tab; refresh(); const t = $(`#tab-${ui.profileTab}`); if (t) t.focus(); },
  async 'student-toggle'(el) {
    const s = getS(el.dataset.id);
    if (s.status === 'Active') {
      const upcoming = db.bookings.filter(b => b.studentId === s.id && isUpcoming(b));
      const res = await confirmDialog({
        title: `Mark ${fullName(s)} as inactive?`,
        message: upcoming.length ? `${esc(s.firstName)} has <strong>${plural(upcoming.length, 'upcoming booking')}</strong>. Would you like to cancel them as well?` : `${esc(s.firstName)} will no longer appear when booking lessons or tests.`,
        choices: upcoming.length ? [{ value: 'keep', label: 'Keep bookings', cls: 'btn-outline' }, { value: 'cancel', label: 'Cancel bookings', cls: 'btn-danger' }] : [{ value: 'keep', label: 'Mark inactive', cls: 'btn-danger' }]
      });
      if (!res) return;
      s.status = 'Inactive';
      if (res === 'cancel') upcoming.forEach(b => { b.status = 'Cancelled'; b.notes = (b.notes ? b.notes + '\n' : '') + 'Cancelled — student marked inactive.'; });
      toast(`${fullName(s)} is now inactive${res === 'cancel' ? ` and ${plural(upcoming.length, 'booking')} cancelled` : ''}`, 'info');
    } else {
      s.status = 'Active';
      toast(`${fullName(s)} is now active`);
    }
    persist(); refresh();
  },
  async 'instructor-toggle'(el) {
    const i = getI(el.dataset.id);
    if (i.status === 'Active') {
      const upcoming = db.bookings.filter(b => b.instructorId === i.id && isUpcoming(b));
      const ok = await confirmDialog({ title: `Mark ${fullName(i)} as inactive?`,
        message: `Inactive instructors can’t receive new bookings.${upcoming.length ? `<br><br><strong>${plural(upcoming.length, 'upcoming booking')}</strong> will stay in the calendar — reassign or cancel them as needed.` : ''}`,
        confirmText: 'Mark inactive', danger: true });
      if (!ok) return;
      i.status = 'Inactive';
      toast(`${fullName(i)} is now inactive`, 'info');
    } else { i.status = 'Active'; toast(`${fullName(i)} is now active`); }
    persist(); refresh();
  },
  'export-data'() {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `northgate-prototype-data-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Prototype data exported');
  },
  async 'reset-data'() {
    const ok = await confirmDialog({ title: 'Reset prototype data?',
      message: 'This will <strong>permanently remove</strong> every student, instructor, lesson and test you have added or changed in this browser, and reload fresh sample data.<br><br>This cannot be undone.',
      confirmText: 'Reset data', danger: true });
    if (!ok) return;
    db = seedData(); persist();
    ui.students = { q: '', status: 'all', instructor: 'all' }; ui.instructors = { q: '', status: 'all' };
    ui.cal.date = todayISO(); ui.cal.instructor = 'all'; ui.bannerDismissed = false; ui.profileId = null;
    saveUI();
    toast('Prototype data has been reset');
    navigate('#/dashboard');
  },
  'focus-field'(el) {
    const form = el.closest('form') || document;
    const wrap = $(`[data-field="${el.dataset.field}"]`, form);
    const input = wrap && $('input,select,textarea', wrap);
    if (input) { input.focus({ preventScroll: true }); wrap.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  },
  'scroll-to'(el) {
    const t = document.getElementById(el.dataset.target);
    if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); const i = $('input,select,textarea', t); if (i) setTimeout(() => i.focus({ preventScroll: true }), 350); }
  }
};

document.addEventListener('click', e => {
  const qa = e.target.closest('.qa-wrap');
  if (!qa) closeQuickMenu();
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (!fn) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  fn(el, e);
});
// Make month cells keyboard-friendly (Enter/Space on focused row cells handled by inner buttons)
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#qa-menu').hidden) { closeQuickMenu(); $('#qa-btn').focus(); return; }
    if (modalStack.length) { closeModal(); return; }
  }
  // Focus trap inside the top-most modal
  if (e.key === 'Tab' && modalStack.length) {
    const m = modalStack[modalStack.length - 1].el;
    const f = $$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])', m)
      .filter(x => x.offsetParent !== null && !x.closest('[hidden]'));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !m.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  // Arrow-key navigation for tabs
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute('role') === 'tab') {
    const tabs = $$('[role=tab]', e.target.parentElement);
    const idx = tabs.indexOf(e.target) + (e.key === 'ArrowRight' ? 1 : -1);
    const next = tabs[(idx + tabs.length) % tabs.length];
    ui.profileTab = next.dataset.tab; refresh(); const t = $(`#tab-${ui.profileTab}`); if (t) t.focus();
  }
  // Keyboard shortcuts for calendar navigation
  if (current.sec === 'calendar' && !modalStack.length && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) {
    if (e.key === 'ArrowLeft' && !e.target.closest('[role=tablist]')) calShift(-1);
    else if (e.key === 'ArrowRight' && !e.target.closest('[role=tablist]')) calShift(1);
    else if (e.key.toLowerCase() === 't') { ui.cal.date = todayISO(); route(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'student-search') { ui.students.q = e.target.value; $('#student-results').innerHTML = studentResults(); }
  if (e.target.id === 'instructor-search') {
    ui.instructors.q = e.target.value;
    const pos = e.target.selectionStart;
    refresh();
    const s = $('#instructor-search'); s.focus(); s.setSelectionRange(pos, pos);
  }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'cal-date' && e.target.value) { ui.cal.date = e.target.value; route(); }
  if (id === 'cal-instructor') { ui.cal.instructor = e.target.value; saveUI(); route(); }
  if (id === 'cal-cancelled') { ui.cal.showCancelled = e.target.checked; saveUI(); refresh(); }
  if (id === 'student-ins') { ui.students.instructor = e.target.value; $('#student-results').innerHTML = studentResults(); }
});
// Re-render the calendar when crossing the mobile breakpoint (day view layout & agenda change)
window.matchMedia('(max-width: 719px)').addEventListener('change', () => { if (current.sec === 'calendar') route(); });
// Keep "now" line and "upcoming" lists fresh if the page stays open
setInterval(() => { if (!modalStack.length && (current.sec === 'dashboard' || current.sec === 'calendar')) refresh(); }, 5 * 60 * 1000);

route();
})();
</script>
